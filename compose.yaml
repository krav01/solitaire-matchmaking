services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: matchmaking
      POSTGRES_USER: matchmaking
      POSTGRES_PASSWORD: matchmaking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmaking -d matchmaking"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  service:
    build: .
    environment:
      HTTP_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://matchmaking:matchmaking@postgres:5432/matchmaking?sslmode=disable
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
