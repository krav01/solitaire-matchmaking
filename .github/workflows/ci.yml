name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test -shuffle=on -coverprofile=coverage.out ./...

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz hard matchmaking invariants
        run: go test -run '^$' -fuzz '^FuzzSelectRoomPreservesHardSkillGap$' -fuzztime=2s ./pkg/matchmaking

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check package boundaries
        run: bash scripts/check-architecture.sh

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: matchmaking_test
          POSTGRES_USER: matchmaking
          POSTGRES_PASSWORD: matchmaking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchmaking -d matchmaking_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://matchmaking:matchmaking@127.0.0.1:5432/matchmaking_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply embedded migrations twice
        run: go test -count=1 -run '^TestMigrationsApplyToPostgreSQL$' ./internal/postgres
      - name: Test transactional ticket lifecycle
        run: go test -count=1 -run '^TestTicketLifecyclePostgreSQL$' ./internal/postgres
      - name: Test concurrent matchmaking worker
        run: go test -count=1 -run '^TestMatchmakingWorkerPostgreSQL$' ./internal/postgres

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  race:
    name: Race detector
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run full race suite
        run: go test -race -shuffle=on ./...

  benchmark:
    name: Critical benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure matchmaking selection
        run: go test -run '^$' -bench '^BenchmarkSelectRoom$' -benchmem -count=1 ./pkg/matchmaking
