name: CI

on:
  pull_request:
    paths-ignore:
      - '.standards.yml'
      - '.github/workflows/standards-drift.yml'
      - '.github/workflows/standards-upgrade.yml'
  push:
    branches: [main]
    paths-ignore:
      - '.standards.yml'
      - '.github/workflows/standards-drift.yml'
      - '.github/workflows/standards-upgrade.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Build
        run: go build ./...
      - name: Verify non-root container image
        run: make container
      - name: Test with race detector
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz hard matchmaking invariants
        run: go test -run '^$' -fuzz '^FuzzSelectRoomPreservesHardSkillGap$' -fuzztime=10000x ./pkg/matchmaking

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check package boundaries
        run: bash scripts/check-architecture.sh

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: matchmaking_test
          POSTGRES_USER: matchmaking
          POSTGRES_PASSWORD: matchmaking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matchmaking -d matchmaking_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://matchmaking:matchmaking@127.0.0.1:5432/matchmaking_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply embedded migrations twice
        run: go test -count=1 -run '^TestMigrationsApplyToPostgreSQL$' ./internal/postgres
      - name: Test retryable outbox delivery
        run: go test -count=1 -run '^TestOutboxDeliveryPostgreSQL$' ./internal/postgres
      - name: Test transactional ticket lifecycle
        run: go test -count=1 -run '^TestTicketLifecyclePostgreSQL$' ./internal/postgres
      - name: Test concurrent matchmaking worker
        run: go test -count=1 -run '^TestMatchmakingWorkerPostgreSQL$' ./internal/postgres
      - name: Test time-ordered rating worker
        run: go test -count=1 -run '^TestRatingWorkerPostgreSQL$' ./internal/postgres
      - name: Test isolated rating shadow timeline
        run: go test -count=1 -run '^TestRatingShadowPostgreSQL.*$' ./internal/postgres
      - name: Test verified result finalization
        run: go test -count=1 -run '^TestResultFinalizationPostgreSQL$' ./internal/postgres
      - name: Test complete tournament lifecycle
        run: go test -count=1 -run '^TestTournamentLifecyclePostgreSQLEndToEnd$' ./internal/postgres
      - name: Test load, recovery and failure injection
        run: go test -count=1 -run '^TestOutboxResiliencePostgreSQL$' ./internal/postgres

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  benchmark:
    name: Critical benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Measure matchmaking selection
        run: go test -run '^$' -bench '^BenchmarkSelectRoom$' -benchmem -count=1 ./pkg/matchmaking
