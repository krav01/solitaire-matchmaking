name: Debug race

on:
  pull_request:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Capture race output
        shell: bash
        run: |
          set +e
          go test -race -shuffle=on ./... > race-output.txt 2>&1
          status=$?
          echo "$status" > race-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: race-diagnostics
          path: |
            race-output.txt
            race-status.txt
          retention-days: 1
