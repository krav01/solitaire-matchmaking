groups:
  - name: solitaire-matchmaking
    rules:
      - alert: SolitaireMatchmakingDown
        expr: up{job="solitaire-matchmaking"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Solitaire matchmaking is unavailable to Prometheus
          description: The metrics endpoint has been unreachable for two minutes.

      - alert: SolitaireMatchmakingFairnessLimitViolation
        expr: increase(solitaire_matchmaking_matchmaking_fairness_violations_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: A filled room exceeded a hard fairness limit
          description: Stop rollout and inspect the policy/model version before allowing further traffic.

      - alert: SolitaireMatchmakingWorkerErrorsSustained
        expr: sum by (worker) (rate(solitaire_matchmaking_worker_cycles_total{result="error"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A background worker has sustained errors
          description: Inspect structured logs and retry state for the affected worker.
